version: 2

builds:
  - id: ahdbmerge
    main: ./cmd/ahdbmerge
    binary: ahdbmerge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
checksum:
  name_template: "checksums_ahdbmerge.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
gomod:
  # build from the module proxy so the binary reports its version (ahdbmerge -version, sync version check)
  proxy: true
  mod: mod
archives:
  - format_overrides:
      - goos: windows
        formats: [zip]
      - goos: darwin
        formats: [zip]
    name_template: "ahdbmerge_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
release:
  prerelease: auto
  mode: append
